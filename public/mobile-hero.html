<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muralis — Premium Custom Murals & Wall Art</title>
  
  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FAF8F5',
              100: '#F5F0EB',
              200: '#EBE2D8',
            },
            terracotta: {
              500: '#D96B43',
              600: '#C85A32',
              700: '#B04B26',
            },
            gold: {
              400: '#E5C158',
              500: '#D4AF37',
              600: '#B89324',
            },
            charcoal: {
              700: '#44403C',
              800: '#292524',
              900: '#1C1917',
            }
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Grain texture overlay */
    .bg-grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
    }

    /* Staggered Entrance Animations */
    .animate-fade-up {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.25s; }
    .delay-3 { animation-delay: 0.4s; }
    .delay-4 { animation-delay: 0.55s; }
    .delay-5 { animation-delay: 0.7s; }

    /* Subtle image hover zoom */
    .hero-img-container img {
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hero-img-container:hover img {
      transform: scale(1.03);
    }
  </style>
</head>
<body class="bg-cream-50 text-charcoal-900 font-sans antialiased selection:bg-terracotta-500 selection:text-white relative min-h-screen">
  
  <!-- Canvas Container tuned specifically for mobile viewport (max-w-md / 428px) -->
  <div class="max-w-[428px] mx-auto min-h-screen bg-cream-50 border-x border-stone-200/60 shadow-xl relative bg-grain overflow-x-hidden pb-10">
    
    <!-- MAIN HERO CONTENT SECTION (Generous Vertical Padding: py-8 to py-10) -->
    <main class="py-8 px-5 flex flex-col space-y-6">

      <!-- 3. HERO IMAGE CONTAINER (Full-width, 4:5 aspect ratio, soft shadow, floating badge) -->
      <div class="animate-fade-up delay-3 relative w-full pt-2">
        <!-- Background blurred gradient blob for depth -->
        <div class="absolute -inset-2 bg-gradient-to-tr from-terracotta-500/20 via-gold-500/20 to-orange-300/15 rounded-3xl blur-xl opacity-80 -z-10 transform scale-95"></div>

        <!-- Image Wrapper -->
        <div class="hero-img-container relative w-full aspect-[16/9] rounded-2xl overflow-hidden shadow-xl shadow-stone-900/10 border border-stone-200/80 bg-stone-100">
          <img 
            src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1000&q=85" 
            alt="Custom Handpainted Architectural Mural" 
            class="w-full h-full object-cover object-center"
            loading="eager"
          />

          <!-- Vignette gradient inside image -->
          <div class="absolute inset-0 bg-gradient-to-t from-charcoal-900/40 via-transparent to-transparent"></div>

          <!-- Floating Pill Badge overlapping bottom corner -->
          <div class="absolute bottom-4 left-4 right-auto z-10 flex items-center gap-2 px-3.5 py-2 rounded-full bg-cream-50/85 backdrop-blur-md border border-white/60 shadow-lg shadow-black/10">
            <span class="text-sm">🎨</span>
            <span class="text-xs font-semibold text-charcoal-900 tracking-tight">Handpainted by Master Artists</span>
          </div>
        </div>
      </div>

      <!-- 4. CTA BUTTONS (Stacked full-width for easy thumb tapping) -->
      <div class="animate-fade-up delay-4 flex flex-col gap-3 pt-2">
        <!-- Primary CTA Button -->
        <a 
          href="#shop" 
          class="w-full min-h-[48px] py-3.5 px-6 rounded-full bg-terracotta-600 hover:bg-terracotta-700 active:scale-[0.98] text-white font-bold text-base tracking-wide text-center flex items-center justify-center gap-2 shadow-md shadow-terracotta-600/25 transition-all duration-200"
        >
          <span>Shop</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </a>

        <!-- Secondary CTA Button -->
        <a 
          href="#custom" 
          class="w-full min-h-[48px] py-3.5 px-6 rounded-full bg-transparent border-2 border-stone-300 hover:border-charcoal-800 active:scale-[0.98] text-charcoal-900 font-semibold text-base text-center flex items-center justify-center transition-all duration-200"
        >
          Book Custom Design
        </a>
      </div>

      <!-- 5. TRUST ROW -->
      <div class="animate-fade-up delay-5 pt-3 pb-2 flex items-center justify-center gap-3">
        <!-- Overlapping User Avatar Icons -->
        <div class="flex -space-x-2 overflow-hidden">
          <div class="w-7 h-7 rounded-full bg-stone-100 ring-2 ring-cream-50 flex items-center justify-center border border-stone-300">
            <svg class="w-4 h-4 text-stone-800" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          <div class="w-7 h-7 rounded-full bg-stone-200 ring-2 ring-cream-50 flex items-center justify-center border border-stone-300">
            <svg class="w-4 h-4 text-stone-800" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          <div class="w-7 h-7 rounded-full bg-stone-300 ring-2 ring-cream-50 flex items-center justify-center border border-stone-300">
            <svg class="w-4 h-4 text-stone-800" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
        </div>

        <!-- Rating Stars & Text -->
        <div class="flex items-center gap-1.5 text-stone-600 text-sm font-medium">
          <div class="flex text-amber-500">
            ★★★★★
          </div>
          <span class="text-charcoal-900 font-semibold">4.9/5</span>
          <span class="text-stone-500 text-xs">(1,200+ customers)</span>
        </div>
      </div>

    </main>

  </div>

  <!-- Interactive JavaScript for animations & scroll effects -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navbar = document.getElementById('navbar');

      // Scroll effect for header glass intensity
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          navbar.classList.add('shadow-sm', 'bg-cream-50/95');
        } else {
          navbar.classList.remove('shadow-sm', 'bg-cream-50/95');
        }
      });

      // Subtle active tap feedback for mobile buttons
      const buttons = document.querySelectorAll('a, button');
      buttons.forEach(btn => {
        btn.addEventListener('touchstart', () => {
          btn.style.opacity = '0.9';
        });
        btn.addEventListener('touchend', () => {
          btn.style.opacity = '1';
        });
      });
    });
  </script>
</body>
</html>
